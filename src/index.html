<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PAYBACK AI Enablement Film</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="film.js"></script>
<script>
  // Preview mode: open with ?play to watch in a browser (no audio sync), ?t=12.5 to inspect a frame.
  const q = new URLSearchParams(location.search);
  window.filmReady.then(() => {
    if (q.has('play')) {
      const start = performance.now();
      const loop = () => { renderFrame(((performance.now() - start) / 1000) % FILM.duration); requestAnimationFrame(loop); };
      loop();
    } else if (q.has('t')) {
      renderFrame(parseFloat(q.get('t')));
    }
  });
</script>
</body>
</html>
